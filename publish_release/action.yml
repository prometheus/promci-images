name: Publish release image
description: Publish release tag container images using Prometheus common Makefile.
inputs:
  registry:
    description: Docker registry
  organization:
    description: Organization
  login:
    description: Username
  password:
    description: Password
  dockerfile_path:
    description: Path to Dockerfile
    default: ""
  dockerbuild_context:
    description: Path to Dockerbuild context
    default: ""
  container_image_name:
    description: Name of the container image
    default: ""
  working_directory:
    description: Directory passed to make -C (for secondary images with their own Makefile)
    default: "."
  skip_manifest:
    description: Skip make docker-manifest (for single-arch Makefiles without that target)
    default: "false"
  extra_make_args:
    description: Extra arguments appended to make invocations (e.g. REPO_TAG=v1.2.3)
    default: ""
runs:
  using: composite
  steps:
    - if: inputs.dockerfile_path != ''
      run: echo "export DOCKERFILE_PATH=${{ inputs.dockerfile_path }}" >> /tmp/tmp-profile
      shell: bash
    - if: inputs.container_image_name != ''
      run: echo "export DOCKER_IMAGE_NAME=${{ inputs.container_image_name }}" >> /tmp/tmp-profile
      shell: bash
    - if: inputs.dockerbuild_context != ''
      run: echo "export DOCKERBUILD_CONTEXT=${{ inputs.dockerbuild_context }}" >> /tmp/tmp-profile
      shell: bash
    - run: |
        current_tag=${GITHUB_REF#refs/*/}
        touch /tmp/tmp-profile
        . /tmp/tmp-profile
        make -C "${{ inputs.working_directory }}" docker DOCKER_IMAGE_TAG="$current_tag" REPO_TAG="$current_tag" DOCKER_REPO=${{ inputs.registry }}/${{ inputs.organization }} ${{ inputs.extra_make_args }}
        docker images
        echo ${{ inputs.password }} | docker login -u ${{ inputs.login }} --password-stdin ${{ inputs.registry }}
        make -C "${{ inputs.working_directory }}" docker-publish DOCKER_IMAGE_TAG="$current_tag" REPO_TAG="$current_tag" DOCKER_REPO=${{ inputs.registry }}/${{ inputs.organization }} ${{ inputs.extra_make_args }}
        if [[ "${{ inputs.skip_manifest }}" != "true" ]]; then
          make -C "${{ inputs.working_directory }}" docker-manifest DOCKER_IMAGE_TAG="$current_tag" REPO_TAG="$current_tag" DOCKER_REPO=${{ inputs.registry }}/${{ inputs.organization }} ${{ inputs.extra_make_args }}
        fi
        if [[ "$current_tag" =~ ^v[0-9]+(\.[0-9]+){2}$ ]]; then
          # Get the latest stable release tag (excluding pre-releases)
          latest_tag=$(git tag -l 'v*' | grep -P '^v\d+\.\d+\.\d+$' | sort -V -r | head -n1)
          echo "Current tag: $current_tag"
          echo "Latest stable tag: $latest_tag"

          # Only push "latest" tags if this is the latest stable release
          if [[ "${current_tag}" == "${latest_tag}" ]]; then
            echo "This is the latest stable release, pushing 'latest' tags"
            make -C "${{ inputs.working_directory }}" docker-tag-latest DOCKER_IMAGE_TAG="$current_tag" REPO_TAG="$current_tag" DOCKER_REPO=${{ inputs.registry }}/${{ inputs.organization }} ${{ inputs.extra_make_args }}
            make -C "${{ inputs.working_directory }}" docker-publish DOCKER_IMAGE_TAG="latest" REPO_TAG="$current_tag" DOCKER_REPO=${{ inputs.registry }}/${{ inputs.organization }} ${{ inputs.extra_make_args }}
            if [[ "${{ inputs.skip_manifest }}" != "true" ]]; then
              make -C "${{ inputs.working_directory }}" docker-manifest DOCKER_IMAGE_TAG="latest" REPO_TAG="$current_tag" DOCKER_REPO=${{ inputs.registry }}/${{ inputs.organization }} ${{ inputs.extra_make_args }}
            fi
          else
            echo "Skipping 'latest' tags - $current_tag is not the latest stable release"
          fi
        fi
      shell: bash
