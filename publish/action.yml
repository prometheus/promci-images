name: Publish image
description: Publish container images using Prometheus common Makefile.
inputs:
  registry:
    description: Docker registry
  organization:
    description: Organization
  login:
    description: Username
  password:
    description: Password
  dockerfile_path:
    description: Path to Dockerfile
    default: ""
  dockerbuild_context:
    description: Path to Dockerbuild context
    default: ""
  container_image_name:
    description: Name of the container image
    default: ""
  docker_image_tag:
    description: A custom image tag to be added
  working_directory:
    description: Directory passed to make -C (for secondary images with their own Makefile)
    default: "."
  skip_manifest:
    description: Skip make docker-manifest (for single-arch Makefiles without that target)
    default: "false"
  extra_make_args:
    description: Extra arguments appended to make invocations (e.g. REPO_TAG=main)
    default: ""
runs:
  using: composite
  steps:
    - if: inputs.dockerfile_path != ''
      run: echo "export DOCKERFILE_PATH=${{ inputs.dockerfile_path }}" >> /tmp/tmp-profile
      shell: bash
    - if: inputs.container_image_name != ''
      run: echo "export DOCKER_IMAGE_NAME=${{ inputs.container_image_name }}" >> /tmp/tmp-profile
      shell: bash
    - if: inputs.dockerbuild_context != ''
      run: echo "export DOCKERBUILD_CONTEXT=${{ inputs.dockerbuild_context }}" >> /tmp/tmp-profile
      shell: bash
    - if: inputs.docker_image_tag != ''
      run: echo "export DOCKER_IMAGE_TAG=${{ inputs.docker_image_tag }}" >> /tmp/tmp-profile
      shell: bash
    - run: |
        touch /tmp/tmp-profile
        . /tmp/tmp-profile
        make -C "${{ inputs.working_directory }}" docker DOCKER_REPO=${{ inputs.registry }}/${{ inputs.organization }} ${{ inputs.extra_make_args }}
        docker images
        echo ${{ inputs.password }} | docker login -u ${{ inputs.login }} --password-stdin ${{ inputs.registry }}
        make -C "${{ inputs.working_directory }}" docker-publish DOCKER_REPO=${{ inputs.registry }}/${{ inputs.organization }} ${{ inputs.extra_make_args }}
        if [[ "${{ inputs.skip_manifest }}" != "true" ]]; then
          make -C "${{ inputs.working_directory }}" docker-manifest DOCKER_REPO=${{ inputs.registry }}/${{ inputs.organization }} ${{ inputs.extra_make_args }}
        fi
      shell: bash
